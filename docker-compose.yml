version: '3'
services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    restart: always
    ports:
      - "2222:2222"
    volumes:
      - ./honeypot/cowrie/etc/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg
      - ./honeypot/cowrie/var:/cowrie/cowrie-git/var

  
  dionaea:
    image: dinotools/dionaea:latest
    container_name: dionaea
    restart: unless-stopped
    ports:
      - "21:21"      # FTP
      - "42:42"      # WINS
      - "69:69/udp"  # TFTP
      - "135:135"    # RPC
      - "443:443"    # HTTPS
      - "445:445"    # SMB (le plus important pour capturer des malwares)
      - "1433:1433"  # MSSQL
      - "1723:1723"  # PPTP
      - "3306:3306"  # MySQL
    volumes:
      - ./honeypot/dionaea/etc/dionaea:/opt/dionaea/etc/dionaea
      - ./honeypot/dionaea/var:/opt/dionaea/var/lib/dionaea
  honeytrap:
    image: honeytrap/honeytrap:latest
    container_name: honeytrap
    volumes:
      - ./honeypot/honeytrap/etc/config.toml:/config/config.toml:ro
      - ./honeypot/honeytrap/log:/var/log/honeytrap
      - ./honeypot/honeytrap/assets:/config/assets:ro
    ports:
      - "80:80"
      - "443:443"
      - "3306:3306"
      - "5900:5900"
    restart: always

  # 2. La Base de Données (Ajouté)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Limite la RAM pour ta VM VMware
    ports:
      - "9200:9200"
    restart: always
    volumes:
      - esdata:/usr/share/elasticsearch/data

  # 3. L'API d'Analyse
  fastapi:
    build: ./analyse_layer
    container_name: fastapi
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      - elasticsearch # Attend que la base de données soit lancée

  # 4. Le transporteur (Shipper)
  shipper:
    build: ./shipper
    container_name: shipper
    restart: always
    volumes:
      - ./honeypot/cowrie/var/log/cowrie:/var/log/cowrie:ro
    depends_on:
      - fastapi
volumes:
  esdata:
    # Volume volontairement externe : `docker compose down -v` ne le supprime pas.
    # Créer une seule fois avec : docker volume create pfa_esdata
    external: true
    name: pfa_esdata
