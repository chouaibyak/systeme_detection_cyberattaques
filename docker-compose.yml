services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    # Les journaux montés depuis l'hôte appartiennent à l'utilisateur local
    # (UID/GID 1000). Cette identité permet à jsonlog de les ouvrir en écriture.
    user: "1000:1000"
    restart: always
    ports:
      - "2222:2222"
    volumes:
      - ./honeypot/cowrie/etc/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg
      - ./honeypot/cowrie/var:/cowrie/cowrie-git/var
    networks:
      - detection_network
  

  dionaea:
    image: dinotools/dionaea:latest
    container_name: dionaea
    restart: unless-stopped
    ports:
      - "21:21"      # FTP
      - "42:42"      # WINS
      - "69:69/udp"  # TFTP
      - "135:135"    # RPC
      - "443:443"    # HTTPS
      - "445:445"    # SMB (le plus important pour capturer des malwares)
      - "1433:1433"  # MSSQL
      - "1723:1723"  # PPTP
      - "3306:3306"  # MySQL
    volumes:
      - ./honeypot/dionaea/etc/dionaea:/opt/dionaea/etc/dionaea
      - ./honeypot/dionaea/var:/opt/dionaea/var/lib/dionaea
    networks:
      - detection_network

  honeytrap:
    image: honeytrap/honeytrap:latest
    container_name: honeytrap
    volumes:
      - ./honeypot/honeytrap/etc/config.toml:/config/config.toml:ro
      - ./honeypot/honeytrap/log:/var/log/honeytrap
      - ./honeypot/honeytrap/assets:/config/assets:ro
    ports:
      - "80:80"
      - "8443:443"
      - "3307:3306"
      - "5900:5900"
    restart: always
    networks:
      - detection_network

  # 2. La Base de Données (Ajouté)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Limite la RAM pour ta VM VMware
      # Appliqué avant le parseur Elasticsearch : contourne le bug cgroup v2 de la JVM dans cette VM.
      - "JDK_JAVA_OPTIONS=-XX:-UseContainerSupport"
    ports:
      - "9200:9200"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - detection_network

  # 3. L'API d'Analyse
  fastapi:
    build:
      context: .
      dockerfile: analyse_layer/Dockerfile
    container_name: fastapi
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - detection_network

  # 4. Le transporteur (Shipper)
  shipper:
    build: ./shipper
    container_name: shipper
    restart: always
    volumes:
      - ./honeypot/cowrie/var/log/cowrie:/var/log/cowrie:ro
      - ./honeypot/dionaea/var:/opt/dionaea/var/lib/dionaea:ro
      - ./honeypot/honeytrap/log:/var/log/honeytrap:ro
    depends_on:
      fastapi:
        condition: service_started
    networks:
      - detection_network

  
  neo4j:
    image: neo4j:5.12 # Version stable
    container_name: cyberdna_neo4j
    ports:
      - "7474:7474" # Interface HTTP (Navigateur)
      - "7687:7687" # Protocole Bolt (Connexion Python)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      # On utilise les variables définies dans le fichier .env
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    restart: unless-stopped
    networks:
      - detection_network # Assure-toi d'utiliser le même réseau que FastAPI


  # --- DÉFINITION DES RÉSEAUX ---
networks:
  detection_network:
    driver: bridge

# --- DÉFINITION DES VOLUMES ---
volumes:
  esdata:
    # Volume volontairement externe : `docker compose down -v` ne le supprime pas.
    # Créer une seule fois avec : docker volume create pfa_esdata
    external: true
    name: pfa_esdata
  neo4j_data:
  neo4j_logs:

  
